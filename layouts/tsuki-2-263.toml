[meta]
name    = "月配列2-263式"
version = "1.0"
mode    = "kana"
schema  = 1

[settings]
chord_window_ms    = 50
mutual_window_ms   = 80
caps_lock_behavior = "shift"
on_focus_change    = "preserve"
roll_over          = true

# ── Base layer ────────────────────────────────────────────────────────────────
[[layer]]
id   = "base"
kind = "single"
grid = """
. .    q    w    e    r    t    y    u    i    o    p
1 ＿   。   か   た   こ   さ   ら   ち   く   つ   ，
2 ＿   う   し   て   け   せ   は   と   き   い   ん
3 ＿   ＿   に   な   っ   く   は   の   や   ゅ   を
"""

# ── D 前置シフト ──────────────────────────────────────────────────────────────
[[layer]]
id      = "prefix_d"
kind    = "prefix"
trigger = "d"
grid    = """
. .    q    w    e    r    t    y    u    i    o    p
1 ＿   ぁ   え   り   ゃ   れ   ぱ   ぢ   ぐ   づ   ぴ
2 ＿   を   ゔ   ぃ   ぬ   ょ   ふ   ご   げ   ぞ   ぼ
3 ＿   ぅ   ひ   そ   み   .    ゆ   に   ま   の
"""

# ── K 前置シフト ──────────────────────────────────────────────────────────────
[[layer]]
id      = "prefix_k"
kind    = "prefix"
trigger = "k"
grid    = """
. .    q    w    e    r    t    y    u    i    o    p
1 ＿   ぽ   あ   な   ろ   よ   む   ぺ   ぷ   ぴ   ぁ
2 ＿   お   も   ね   め   ぬ   お   わ   ょ   ゃ   ぇ
3 ＿   ゃ   ぶ   じ   べ   ぎ   ぜ   ぐ   づ   ぞ   ぼ
"""
