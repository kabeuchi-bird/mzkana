# ============================================================
# 薙刀式 v17（センターシフト + 相互シフト）
# ============================================================

[meta]
name    = "薙刀式"
version = "17.0"
mode    = "kana"
schema  = 1

[settings]
chord_window_ms    = 50
mutual_window_ms   = 80
caps_lock_behavior = "shift"
on_focus_change    = "preserve"
roll_over          = true

# ── センターシフト定義 ────────────────────────────────────────────────────────
[[modifier]]
id              = "center"
key             = "space"
kind            = "hold"
hold_detection  = "interrupt"
hold_timeout_ms = 150
tap_action      = "send_key"

# ── Base layer ────────────────────────────────────────────────────────────────
[[layer]]
id   = "base"
kind = "single"
grid = """
. q    w    e    r    t    y    u    i    o    p
1 ．   き   て   し   ．   ．   ．   る   す   へ
2 ろ   け   と   か   っ   く   あ   い   う   ー
3 ほ   ひ   は   こ   そ   た   な   ん   ら   れ
"""

# ── センターシフト層 ──────────────────────────────────────────────────────────
[[layer]]
id       = "center_shift"
kind     = "modified"
modifier = "center"
grid     = """
. q    w    e    r    t    y    u    i    o    p
1 ．   め   り   ね   ．   ．   さ   よ   え   ゆ
2 せ   み   に   ま   ち   や   の   も   つ   ふ
3 ほ   ひ   を   、   ぬ   お   。   む   わ   れ
"""

# ── 相互シフト（濁音・拗音など） ──────────────────────────────────────────────

[[chord]]
keys      = ["f", "j"]
output    = "が"
symmetric = true
window_ms = 80

[[chord]]
keys      = ["r", "j"]
output    = "じ"
symmetric = true
window_ms = 80

[[chord]]
keys      = ["v", "j"]
output    = "ご"
symmetric = true
window_ms = 80

[[chord]]
keys      = ["e", "j"]
output    = "で"
symmetric = true
window_ms = 80

[[chord]]
keys      = ["d", "j"]
output    = "ど"
symmetric = true
window_ms = 80

[[chord]]
keys      = ["c", "j"]
output    = "ば"
symmetric = true
window_ms = 80
