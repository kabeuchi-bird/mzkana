# ============================================================
# 薙刀式 v17（センターシフト + 相互シフト）
# ============================================================

[meta]
name    = "薙刀式"
version = "17.0"
mode    = "kana"
schema  = 1

[settings]
chord_window_ms    = 50
mutual_window_ms   = 80
caps_lock_behavior = "shift"
on_focus_change    = "preserve"
roll_over          = true

# ── センターシフト定義 ────────────────────────────────────────────────────────
[[modifier]]
id              = "center"
key             = "space"
kind            = "hold"
hold_detection  = "interrupt"
hold_timeout_ms = 150
tap_action      = "send_key"

# ── 別名シーケンス定義 ────────────────────────────────────────────────────────
# グリッドや chord の output フィールドで `ku_ret` / `to_ret` を参照できます。
[[alias]]
ku_ret = "、 !Return"
to_ret = "。 !Return"

# ── Base layer ────────────────────────────────────────────────────────────────
[[layer]]
id   = "base"
kind = "single"
grid = """
. .    q    w    e    r    t    y    u    i    o    p
1 ＿   ＿   き   て   し   !Up !Down !BackSpace  る   す   へ
2 ＿   ろ   け   と   か   っ   く   あ   い   う   ー
3 ＿   ほ   ひ   は   こ   そ   た   な   ん   ら   れ
"""

# ── センターシフト層 ──────────────────────────────────────────────────────────
[[layer]]
id       = "center_shift"
kind     = "modified"
modifier = "center"
grid     = """
. .    q    w    e    r    t    y    u    i    o    p
1 ＿   ＿   め   り   ね   ＿   ＿   さ   よ   え   ゆ
2 ＿   せ   み   に   ま   ち   や   の   も   つ   ふ
3 ＿   ほ   ひ   を ku_ret ぬ   お to_ret む   わ   れ
"""

# ── 相互シフト（濁音・拗音・半濁音） ────────────────────────────────────────
# 出典: https://github.com/kabeuchi-bird/nagi/blob/main/nagi.kbd の defchords nagi
#       （130 行以降の 2 キー同時押し定義）。ローマ字マクロをかなへ変換して転記。
# 注: 拗音（きゃ 等）は 2 文字出力。BS-rewrite が Mozc preedit 文字数で書き換える
#     ことの実機検証用に重要。nagi.kbd の 3 キー以上の同時押し（濁拗音・外来音・
#     ヴァ行・小書き合成）と編集レイヤ（d f 等）は、現状の mutual chord 機構が
#     2 キー prefix と衝突するため未収録（将来対応）。

