version: "2"

language: "ja"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_instructions:
    - path: "crates/mzkana-core/src/statemachine.rs"
      instructions: |
        状態機械の核心コードです。以下の観点を重点的にレビューしてください。
        - speculative execution と BS-rewrite の一貫性（tentative_buffer と Mozc preedit の同期）
        - chord_window_ms/mutual_window_ms のタイマー処理の正確さ
        - pending_keys の不変条件（leakしていないか）
        - kanchoku モード中に speculative 送信が発生しないこと（silent 動作）
        - CONVERSION モード遷移時に tentative_buffer が適切にクリアされること

    - path: "crates/mzkana-core/src/config.rs"
      instructions: |
        設定パーサーです。以下を確認してください。
        - グリッド文字列のパース（QWERTY 行マッピング、プレースホルダセルのスキップ）
        - 競合検出ロジック（同一 context での出力相違）
        - serde/schemars derive の正確さ（フィールド名の snake_case 変換）
        - エラーメッセージの明確さ

    - path: "crates/mzkana-ffi/src/**"
      instructions: |
        Rust → C ABI ブリッジ層です。以下を確認してください。
        - Safety コメントが各 unsafe fn に付いているか
        - NULL ポインタ / 不正ポインタに対するガード（mzkana_engine_destroy(NULL) など）
        - MzkanaResult のバッファサイズ（preedit 512B / commit 512B / passthrough_key 64B）がオーバーフローしないか
        - cbindgen.toml と実際のシグネチャが一致しているか（生成後の include/mzkana.h との差分）

    - path: "fcitx5-addon/src/**"
      instructions: |
        Fcitx5 C++ アドオン（InputMethodEngineV2 実装）です。以下を確認してください。
        - keyEvent: Ctrl/Alt/Super/Hyper + bare modifier を正しくスキップしているか
        - 大文字キーシムの小文字正規化ロジックが正確か（FcitxKey_A–Z の範囲外を巻き込まないか）
        - applyResult: setClientPreedit と setPreedit の両方を更新し、updatePreedit / updateUserInterface を呼んでいるか
        - reset/deactivate: clearPreedit を必ず呼んでいるか（preedit の幽霊残留を防ぐ）
        - mzkana_engine_check_reload の呼び出しタイミング（毎キーイベント or タイマー）が適切か
        - engine_ が nullptr の場合（設定ファイル未作成時）に keyEvent でクラッシュしないか

    - path: "fcitx5-addon/CMakeLists.txt"
      instructions: |
        CMake ビルド定義です。以下を確認してください。
        - find_package(Fcitx5Core) フォールバック（Strategy A / B）が正しく機能するか
        - FCITX5_USE_SRC_HEADERS=ON 時にスタブヘッダパスが競合しないか
        - MODULE ターゲットに PREFIX "" が設定されているか（fcitx5 のアドオン命名規則）
        - install() のパスが実際の fcitx5 インストール先と一致しているか

    - path: "layouts/*.toml"
      instructions: |
        配列定義ファイルです。以下を確認してください。
        - グリッドのセル数が列ヘッダと一致しているか
        - chord の keys が base layer に存在するキーを参照しているか
        - direct の sequence が重複なく定義されているか
        - mode フィールドが配列の特性に合っているか（kana/kanchoku/hybrid）

    - path: "crates/mzkana-core/src/tests.rs"
      instructions: |
        テストコードです。以下を確認してください。
        - テストが設計書（mzkana-design.md）の付録 B に記載された動作トレースと一致しているか
        - 境界ケース（chord_window 境界、empty tentative_buffer、CONVERSION 後の入力）のカバレッジ
        - テスト名が日本語のドメイン概念を適切に表しているか

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "local"

  issues:
    scope: "local"

  jira:
    project_keys: []

  linear:
    team_keys: []
