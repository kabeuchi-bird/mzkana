[package]
name = "mzkana-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mzkana"
path = "src/main.rs"

[dependencies]
mzkana-core = { path = "../mzkana-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
